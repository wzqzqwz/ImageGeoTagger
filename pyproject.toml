[build-system]
requires = ["setuptools>=64.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "geo-media-tool"
version = "3.0.0"
description = "跨平台图像/视频/音频地理位置信息与日期批量处理工具"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Media Tool Team"},
]
requires-python = ">=3.9"
dependencies = [
    "Pillow>=9.0.0",
    "exifread>=3.0.0",
    "piexif>=1.1.3",
    "numpy>=1.21.0",
    "rawpy>=0.18.0",
    "tkinterdnd2>=0.4.0",
]

[project.urls]
Homepage = "https://github.com/wzqzqwz/ImageGeoTagger"

[tool.setuptools.packages.find]
include = ["geo_media_tool*"]
